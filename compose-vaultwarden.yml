services:
  vaultwarden:
    image: vaultwarden/server:latest
    container_name: vaultwarden
    restart: always
    env_file:
      - ./conf/vaultwarden/.env
    labels:
      - "com.centurylinklabs.watchtower.stop-signal=SIGHUP"

    volumes:
      - /data/containers/vaultwarden/vw-data:/data
    ports:
      - 8081:80
